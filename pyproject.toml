[project]
name = "autojudge"
version = "0.1.0"
description = "Optimization and Building of Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markitdown[all]>=0.1.3",
    "crawlee[playwright]>=1.0.4",
    "fastmcp>=2.13.0.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "pydantic-ai>=1.0.15",
    "tenacity>=9.1.2",
    "pillow>=11.3.0",
    "e2b-code-interpreter>=2.1.0",
    "langfuse>=3.6.1,<4.0.0",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "genai-prices>=0.0.29",
    "openai>=1.109.1",
    "openpyxl-image-loader>=1.0.5",
    "python-docx>=1.2.0",
    "arxiv>=2.3.0",
    "py-key-value-aio[disk]>=0.2.8",
    "browser-use>=0.8.0",
    "opentelemetry-api<1.39.0",
    "orjson>=3.9.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "prek>=0.2.18",
    "ty>=0.0.1a31",
    "ruff>=0.14.7",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.2.0",
    "mypy>=1.19.1",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
benchmarks = [
    "datasets==3.6.0",
    "deepeval>=3.7.6",
    "huggingface-hub>=0.35.3",
    "tqdm>=4.67.1",
    "tiktoken>=0.7.0",
    "google-genai>=0.2.0",
    "pyarrow>=14.0.0",
]
frontend = [
    "streamlit==1.51.0",
    "htbuilder==0.9.0",
    "graphviz==0.21",
    "litellm>=1.80.0",
]

# Temporary unvailable
# maseval = [
#     "maseval",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autojudge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["graphviz.*", "streamlit.*", "htbuilder.*", "autojudge.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q -W ignore"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
