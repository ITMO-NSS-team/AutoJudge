site_name: autojudge
site_description: Optimization and Building of Multi-Agent Systems

repo_name: autojudge-research/autojudge
repo_url: https://github.com/ITMO-NSS-team/autojudge-research
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Run in Container: docker.md
  - Core Concepts:
      - Agent Pools: agent-pools.md
      - Pipelines: pipelines.md
      - Nodes: nodes.md
      - Meta Agents: meta-agents.md
  - Examples:
      - Basic Usage: examples/basic.md
      - Advanced Workflows: examples/advanced.md
  - API Reference: api.md

theme:
  name: "material"
  palette:
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: "Switch to system preference"
  features:
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - navigation.sections
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
